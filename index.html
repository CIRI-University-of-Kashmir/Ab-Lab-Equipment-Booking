
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab Equipment Booking System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-50: #E1F5EE;
      --green-600: #0F6E56;
      --green-700: #1D9E75;
      --blue-50: #E6F1FB;
      --red-50: #FCEBEB;
      --red-600: #A32D2D;
      --red-100: #F7C1C1;
      --gray-50: #F7F6F3;
      --gray-100: #EDEDEA;
      --gray-200: #D3D1C7;
      --text-primary: #1a1a18;
      --text-secondary: #5F5E5A;
      --text-tertiary: #888780;
      --border: rgba(0,0,0,0.12);
      --border-strong: rgba(0,0,0,0.22);
      --surface: #ffffff;
      --surface-secondary: #F7F6F3;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text-primary: #F0EFEA;
        --text-secondary: #B4B2A9;
        --text-tertiary: #888780;
        --border: rgba(255,255,255,0.12);
        --border-strong: rgba(255,255,255,0.22);
        --surface: #1e1e1c;
        --surface-secondary: #2a2a28;
      }
    }

    body {
      font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
      background: var(--surface-secondary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    .topbar {
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-icon {
      width: 34px; height: 34px;
      background: var(--green-50);
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
    }
    .topbar-icon i { font-size: 18px; color: var(--green-600); }
    .topbar h1 { font-size: 16px; font-weight: 600; }
    .topbar p { font-size: 12px; color: var(--text-secondary); margin-left: auto; }

    .layout { display: flex; min-height: calc(100vh - 60px); }

    .sidebar {
      width: 210px;
      background: var(--surface);
      border-right: 0.5px solid var(--border);
      padding: 1.5rem 1rem;
      flex-shrink: 0;
    }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      font-size: 14px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.15s;
      margin-bottom: 2px;
      border: none; background: none; width: 100%; text-align: left;
    }
    .nav-item:hover { background: var(--gray-50); color: var(--text-primary); }
    .nav-item.active { background: var(--green-50); color: var(--green-600); font-weight: 500; }

    .nav-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-tertiary); font-weight: 500;
      padding: 0 12px; margin: 1.2rem 0 6px;
    }

    .main { flex: 1; padding: 2rem; max-width: 1000px; }
    .section { display: none; }
    .section.active { display: block; }

    /* Equipment Grid */
    .equip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
    .equip-card {
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1rem;
      cursor: pointer;
      background: var(--surface);
      transition: all 0.15s;
    }
    .equip-card.selected { border: 2px solid var(--green-700); background: var(--green-50); }
    .equip-card i { font-size: 24px; color: var(--green-600); margin-bottom: 8px; display: block; }
    .equip-name { font-size: 13px; font-weight: 600; }
    .equip-desc { font-size: 11px; color: var(--text-secondary); }

    /* Form Styles */
    .form-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 1.5rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
    .form-group input, .form-group select { padding: 9px 12px; border: 0.5px solid var(--border-strong); border-radius: var(--radius-md); font-size: 13px; background: var(--surface); color: var(--text-primary); }

    .btn-primary { padding: 10px 22px; background: var(--green-700); color: white; border: none; border-radius: var(--radius-md); font-size: 13px; font-weight: 500; cursor: pointer; }
    .btn-outline { padding: 8px 16px; background: none; border: 0.5px solid var(--border-strong); border-radius: var(--radius-md); font-size: 13px; cursor: pointer; color: var(--text-primary); }

    /* Tables */
    .table-wrap { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow-x: auto; }
    .records-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 800px; }
    .records-table th { padding: 12px 14px; text-align: left; color: var(--text-secondary); font-size: 11px; text-transform: uppercase; border-bottom: 0.5px solid var(--border); }
    .records-table td { padding: 12px 14px; border-bottom: 0.5px solid var(--border); }
    .del-btn { background: none; border: none; color: var(--text-tertiary); cursor: pointer; padding: 4px; border-radius: 4px; }
    .del-btn:hover { background: var(--red-50); color: var(--red-600); }

    .badge-admin { background: var(--red-50); color: var(--red-600); font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 8px; font-weight: bold; }
    
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-icon"><i class="ti ti-flask"></i></div>
  <h1>Lab Booking System</h1>
  <p id="current-date"></p>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="nav-label">General</div>
    <button class="nav-item active" onclick="switchTab('book')"><i class="ti ti-calendar-plus"></i> Book Equipment</button>
    <button class="nav-item" onclick="switchTab('records')"><i class="ti ti-clipboard-list"></i> View Records</button>
    
    <div id="admin-menu" style="display:none">
      <div class="nav-label">Administration</div>
      <button class="nav-item" onclick="switchTab('manage')"><i class="ti ti-settings"></i> Manage Gear</button>
    </div>

    <div class="nav-label" style="margin-top: 2rem;">Access</div>
    <button class="nav-item" id="auth-btn" onclick="handleAuth()"><i class="ti ti-lock"></i> Admin Login</button>
  </aside>

  <main class="main">
    <div id="tab-book" class="section active">
      <h2 style="margin-bottom:1.5rem">Book Equipment</h2>
      <div class="equip-grid" id="equip-grid"></div>

      <div class="form-card" id="booking-form" style="display:none">
        <h3 id="selected-title" style="margin-bottom:1.2rem; font-size:15px">Booking Details</h3>
        <div class="form-row">
          <div class="form-group"><label>Full Name</label><input type="text" id="user-name" placeholder="Dr. Sameer Tantray" /></div>
          <div class="form-group"><label>Department / Lab</label><input type="text" id="user-dept" placeholder="Genomics Lab" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Date</label><input type="date" id="book-date" /></div>
          <div class="form-group"><label>Purpose of Use</label><input type="text" id="purpose" placeholder="RNA Extraction" /></div>
        </div>
        <button class="btn-primary" onclick="confirmBooking()">Confirm Booking</button>
        <button class="btn-outline" onclick="cancelSelection()">Cancel</button>
      </div>
    </div>

    <div id="tab-records" class="section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem">
        <h2>Booking History <span id="admin-indicator"></span></h2>
        <button class="btn-outline" onclick="exportCSV()"><i class="ti ti-download"></i> Export</button>
      </div>
      <div class="table-wrap">
        <table class="records-table">
          <thead>
            <tr>
              <th>Equipment</th>
              <th>User</th>
              <th>Dept/Lab</th>
              <th>Purpose</th>
              <th>Date</th>
              <th id="admin-th" style="display:none">Actions</th>
            </tr>
          </thead>
          <tbody id="records-tbody"></tbody>
        </table>
      </div>
    </div>

    <div id="tab-manage" class="section">
      <h2 style="margin-bottom:1.5rem">Equipment Management</h2>
      <div class="form-card">
        <h3 style="margin-bottom:1rem; font-size:14px">Add New Equipment</h3>
        <div class="form-row">
          <div class="form-group"><label>Name</label><input type="text" id="new-eq-name" /></div>
          <div class="form-group"><label>Description</label><input type="text" id="new-eq-desc" /></div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Icon</label>
            <select id="new-eq-icon">
              <option value="ti-refresh">Centrifuge</option>
              <option value="ti-microscope">Microscope</option>
              <option value="ti-temperature">PCR Machine</option>
              <option value="ti-flask">Flask</option>
              <option value="ti-chart-histogram">Sequencer</option>
            </select>
          </div>
          <div class="form-group" style="justify-content:flex-end"><button class="btn-primary" onclick="addEquipment()">Add Gear</button></div>
        </div>
      </div>
      <div class="table-wrap">
        <table class="records-table">
          <thead><tr><th>Icon</th><th>Equipment Name</th><th>Description</th><th>Action</th></tr></thead>
          <tbody id="manage-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
  let isAdmin = false;
  const ADMIN_PASS = 'admin123';
  
  let equipment = JSON.parse(localStorage.getItem('lab_gear')) || [
    { id: 1, name: 'Thermal Cycler', desc: '96-well PCR', icon: 'ti-temperature' },
    { id: 2, name: 'Microcentrifuge', desc: '15000 RPM', icon: 'ti-refresh' }
  ];

  let bookings = JSON.parse(localStorage.getItem('lab_bookings')) || [];
  let selectedEqId = null;

  function init() {
    document.getElementById('current-date').textContent = new Date().toDateString();
    document.getElementById('book-date').min = new Date().toISOString().split('T')[0];
    renderEquipGrid();
    renderRecords();
  }

  function save() {
    localStorage.setItem('lab_gear', JSON.stringify(equipment));
    localStorage.setItem('lab_bookings', JSON.stringify(bookings));
  }

  // --- UI Logic ---
  function switchTab(tabId) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('tab-' + tabId).classList.add('active');
    event.currentTarget.classList.add('active');
    if(tabId === 'manage') renderManageTable();
    if(tabId === 'records') renderRecords();
  }

  function renderEquipGrid() {
    const grid = document.getElementById('equip-grid');
    grid.innerHTML = equipment.map(e => `
      <div class="equip-card ${selectedEqId === e.id ? 'selected' : ''}" onclick="selectEquipment(${e.id})">
        <i class="ti ${e.icon}"></i>
        <div class="equip-name">${e.name}</div>
        <div class="equip-desc">${e.desc}</div>
      </div>
    `).join('');
  }

  function selectEquipment(id) {
    selectedEqId = id;
    const gear = equipment.find(e => e.id === id);
    document.getElementById('selected-title').textContent = "Booking: " + gear.name;
    document.getElementById('booking-form').style.display = 'block';
    renderEquipGrid();
  }

  function cancelSelection() {
    selectedEqId = null;
    document.getElementById('booking-form').style.display = 'none';
    renderEquipGrid();
  }

  // --- Admin Logic ---
  function handleAuth() {
    if(isAdmin) {
      isAdmin = false;
      document.getElementById('admin-menu').style.display = 'none';
      document.getElementById('auth-btn').innerHTML = '<i class="ti ti-lock"></i> Admin Login';
      document.getElementById('admin-indicator').innerHTML = '';
      switchTab('book');
    } else {
      const pw = prompt("Enter Admin Password:");
      if(pw === ADMIN_PASS) {
        isAdmin = true;
        document.getElementById('admin-menu').style.display = 'block';
        document.getElementById('auth-btn').innerHTML = '<i class="ti ti-lock-open"></i> Logout';
        document.getElementById('admin-indicator').innerHTML = '<span class="badge-admin">ADMIN MODE</span>';
        alert("Welcome, Admin.");
      } else if(pw !== null) {
        alert("Access Denied.");
      }
    }
    renderRecords();
  }

  // --- Functional Logic ---
  function confirmBooking() {
    const name = document.getElementById('user-name').value;
    const dept = document.getElementById('user-dept').value;
    const date = document.getElementById('book-date').value;
    const purpose = document.getElementById('purpose').value;

    if(!name || !dept || !date || !selectedEqId) return alert("Please fill all fields!");

    const gear = equipment.find(e => e.id === selectedEqId);
    bookings.push({
      id: Date.now(),
      eqName: gear.name,
      userName: name,
      userDept: dept,
      date: date,
      purpose: purpose || 'General Use'
    });

    save();
    alert("Booking Successful!");
    cancelSelection();
    switchTab('records');
  }

  function renderRecords() {
    const tbody = document.getElementById('records-tbody');
    const adminTh = document.getElementById('admin-th');
    adminTh.style.display = isAdmin ? '' : 'none';

    tbody.innerHTML = bookings.length ? bookings.map(b => `
      <tr>
        <td><b>${b.eqName}</b></td>
        <td>${b.userName}</td>
        <td>${b.userDept}</td>
        <td>${b.purpose}</td>
        <td>${b.date}</td>
        ${isAdmin ? `<td><button class="del-btn" onclick="deleteBooking(${b.id})"><i class="ti ti-trash"></i></button></td>` : ''}
      </tr>
    `).reverse().join('') : '<tr><td colspan="6" style="text-align:center; padding:2rem; color:gray">No records found.</td></tr>';
  }

  function deleteBooking(id) {
    if(confirm("Delete this booking record?")) {
      bookings = bookings.filter(b => b.id !== id);
      save();
      renderRecords();
    }
  }

  // --- Gear Management ---
  function renderManageTable() {
    const tbody = document.getElementById('manage-tbody');
    tbody.innerHTML = equipment.map(e => `
      <tr>
        <td><i class="ti ${e.icon}" style="font-size:18px"></i></td>
        <td>${e.name}</td>
        <td>${e.desc}</td>
        <td><button class="del-btn" onclick="deleteEquipment(${e.id})"><i class="ti ti-trash"></i></button></td>
      </tr>
    `).join('');
  }

  function addEquipment() {
    const name = document.getElementById('new-eq-name').value;
    const desc = document.getElementById('new-eq-desc').value;
    const icon = document.getElementById('new-eq-icon').value;
    if(!name) return;
    
    equipment.push({ id: Date.now(), name, desc, icon });
    save();
    renderManageTable();
    renderEquipGrid();
    document.getElementById('new-eq-name').value = '';
    document.getElementById('new-eq-desc').value = '';
  }

  function deleteEquipment(id) {
    if(confirm("Warning: Deleting equipment will not remove its past booking history, but it will be removed from the booking grid. Proceed?")) {
      equipment = equipment.filter(e => e.id !== id);
      save();
      renderManageTable();
      renderEquipGrid();
    }
  }

  function exportCSV() {
    let csv = "Equipment,User,Department,Purpose,Date\n";
    bookings.forEach(b => {
      csv += `${b.eqName},${b.userName},${b.userDept},${b.purpose},${b.date}\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.setAttribute('href', url);
    a.setAttribute('download', 'lab_bookings.csv');
    a.click();
  }

  init();
</script>
</body>
</html>
