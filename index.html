<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab Equipment Booking System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-50: #E1F5EE; --green-100: #9FE1CB; --green-600: #0F6E56; --green-700: #1D9E75;
      --blue-50: #E6F1FB; --blue-600: #185FA5; --amber-50: #FAEEDA; --amber-600: #854F0B;
      --pink-50: #FBEAF0; --pink-600: #993556; --lime-50: #EAF3DE; --lime-600: #3B6D11;
      --red-50: #FCEBEB; --red-600: #A32D2D; --red-100: #F7C1C1;
      --gray-50: #F7F6F3; --gray-100: #EDEDEA; --gray-200: #D3D1C7; --gray-500: #888780;
      --text-primary: #1a1a18; --text-secondary: #5F5E5A; --text-tertiary: #888780;
      --border: rgba(0,0,0,0.12); --border-strong: rgba(0,0,0,0.22);
      --surface: #ffffff; --surface-secondary: #F7F6F3;
      --radius-md: 8px; --radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text-primary: #F0EFEA; --text-secondary: #B4B2A9; --text-tertiary: #888780;
        --border: rgba(255,255,255,0.12); --border-strong: rgba(255,255,255,0.22);
        --surface: #1e1e1c; --surface-secondary: #2a2a28;
        --gray-50: #2a2a28; --gray-100: #333331;
      }
    }

    body { font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif; background: var(--surface-secondary); color: var(--text-primary); min-height: 100vh; }

    .topbar { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 0 2rem; display: flex; align-items: center; gap: 12px; height: 60px; position: sticky; top: 0; z-index: 100; }
    .topbar-icon { width: 34px; height: 34px; background: var(--green-50); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; }
    .topbar-icon i { font-size: 18px; color: var(--green-600); }
    .topbar h1 { font-size: 16px; font-weight: 600; }
    .topbar p { font-size: 12px; color: var(--text-secondary); margin-left: auto; }

    .layout { display: flex; min-height: calc(100vh - 60px); }
    .sidebar { width: 200px; background: var(--surface); border-right: 0.5px solid var(--border); padding: 1.5rem 1rem; flex-shrink: 0; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius-md); font-size: 14px; cursor: pointer; color: var(--text-secondary); transition: all 0.15s; margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left; }
    .nav-item i { font-size: 17px; }
    .nav-item:hover { background: var(--gray-50); color: var(--text-primary); }
    .nav-item.active { background: var(--green-50); color: var(--green-600); font-weight: 500; }
    .nav-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-tertiary); font-weight: 500; padding: 0 12px; margin: 1.2rem 0 6px; }

    .main { flex: 1; padding: 2rem; max-width: 950px; }
    .section { display: none; }
    .section.active { display: block; }
    .page-title { font-size: 20px; font-weight: 600; margin-bottom: 1.5rem; }

    .equip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
    .equip-card { border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem; cursor: pointer; background: var(--surface); transition: all 0.15s; }
    .equip-card.selected { border: 2px solid var(--green-700); background: var(--green-50); }
    .equip-card i { font-size: 24px; color: var(--green-600); margin-bottom: 8px; display: block; }
    .equip-name { font-size: 13px; font-weight: 500; }
    .equip-desc { font-size: 11px; color: var(--text-secondary); margin-top: 3px; }
    .equip-status { font-size: 10px; margin-top: 10px; padding: 2px 8px; border-radius: 20px; display: inline-block; font-weight: 500; }
    .status-avail { background: var(--lime-50); color: var(--lime-600); }
    .status-busy { background: var(--red-50); color: var(--red-600); }

    .form-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 1rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
    .form-group input, .form-group select { padding: 9px 12px; border: 0.5px solid var(--border-strong); border-radius: var(--radius-md); font-size: 13px; color: var(--text-primary); background: var(--surface); }

    .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; margin-bottom: 1.2rem; }
    .slot { padding: 8px 6px; border: 0.5px solid var(--border); border-radius: var(--radius-md); text-align: center; font-size: 12px; cursor: pointer; background: var(--surface); }
    .slot.selected-slot { border: 2px solid var(--green-700); background: var(--green-50); color: var(--green-600); font-weight: 600; }
    .slot.booked { background: var(--gray-50); color: var(--text-tertiary); cursor: not-allowed; }

    .btn-primary { padding: 10px 22px; background: var(--green-700); color: white; border: none; border-radius: var(--radius-md); font-size: 13px; cursor: pointer; font-weight: 500; }
    .btn-ghost { padding: 8px 16px; background: none; border: 0.5px solid var(--border-strong); border-radius: var(--radius-md); font-size: 13px; cursor: pointer; color: var(--text-primary); }

    .table-wrap { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow-x: auto; }
    .records-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 800px; }
    .records-table th { padding: 10px 14px; text-align: left; color: var(--text-secondary); font-size: 11px; text-transform: uppercase; border-bottom: 0.5px solid var(--border); }
    .records-table td { padding: 11px 14px; border-bottom: 0.5px solid var(--border); }
    .badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 500; }
    .del-btn { background: none; border: none; color: var(--text-tertiary); cursor: pointer; font-size: 16px; }
    .del-btn:hover { color: var(--red-600); }

    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
    .stat-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem; }
    .stat-val { font-size: 20px; font-weight: 600; color: var(--green-600); }
    .stat-lbl { font-size: 11px; color: var(--text-secondary); }

    .alert { padding: 10px 14px; border-radius: var(--radius-md); font-size: 13px; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
    .alert-success { background: var(--lime-50); color: var(--lime-600); border: 0.5px solid #C0DD97; }
    .alert-error { background: var(--red-50); color: var(--red-600); border: 0.5px solid var(--red-100); }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-icon"><i class="ti ti-flask"></i></div>
  <h1>AB Lab Equipments Booking</h1>
  <p id="current-date"></p>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="nav-label">Booking</div>
    <button class="nav-item active" onclick="switchTab('book')"><i class="ti ti-calendar-plus"></i> Book Equipment</button>
    <div class="nav-label">Data</div>
    <button class="nav-item" onclick="switchTab('records')"><i class="ti ti-clipboard-list"></i> Records</button>
    
    <div id="admin-nav" style="display:none">
        <div class="nav-label">Administration</div>
        <button class="nav-item" onclick="switchTab('manage')"><i class="ti ti-settings"></i> Manage Gear</button>
    </div>

    <div class="nav-label" style="margin-top:2rem">Security</div>
    <button class="nav-item" id="auth-btn" onclick="toggleAuth()"><i class="ti ti-lock"></i> Admin Login</button>
  </aside>

  <main class="main">
    <div id="alert-box" style="display:none"></div>

    <div id="tab-book" class="section active">
      <div class="page-title">Book Equipment</div>
      <div class="equip-grid" id="equip-grid"></div>

      <div class="form-card" id="booking-form" style="display:none">
        <h3 id="form-title">Select a time slot</h3>
        <div class="form-row">
          <div class="form-group"><label>Your name</label><input type="text" id="user-name" /></div>
          <div class="form-group"><label>Department / Lab</label><input type="text" id="user-dept" placeholder="e.g. Genomics Lab" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Purpose / Experiment</label><input type="text" id="purpose" /></div>
          <div class="form-group"><label>Date</label><input type="date" id="book-date" onchange="renderSlots()" /></div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Duration</label>
            <select id="duration" onchange="renderSlots()">
              <option value="1">1 hour</option><option value="2">2 hours</option><option value="3">3 hours</option><option value="4">4 hours</option>
            </select>
          </div>
        </div>
        <div class="slots-grid" id="slots-grid"></div>
        <button class="btn-primary" id="confirm-btn" onclick="confirmBooking()" disabled>Confirm Booking</button>
      </div>
    </div>

    <div id="tab-records" class="section">
      <div class="page-title">Booking Records</div>
      <div class="stats-row" id="stats-row"></div>
      <div class="table-wrap">
        <table class="records-table">
          <thead>
            <tr><th>Equipment</th><th>User</th><th>Dept/Lab</th><th>Date</th><th>Slot</th><th>Hrs</th><th>Purpose</th><th id="th-del" style="display:none"></th></tr>
          </thead>
          <tbody id="records-tbody"></tbody>
        </table>
      </div>
      <div style="margin-top:1rem"><button class="btn-ghost" onclick="exportCSV()"><i class="ti ti-download"></i> Export CSV</button></div>
    </div>

    <div id="tab-manage" class="section">
      <div class="page-title">Manage Equipment</div>
      <div class="form-card">
        <h3>Add new equipment</h3>
        <div class="form-row">
          <div class="form-group"><label>Name</label><input type="text" id="new-name" /></div>
          <div class="form-group"><label>Description</label><input type="text" id="new-desc" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Icon</label>
            <select id="new-icon">
              <option value="ti-refresh">Centrifuge</option><option value="ti-microscope">Microscope</option><option value="ti-temperature">PCR</option><option value="ti-flask">Flask</option>
            </select>
          </div>
          <div class="form-group" style="justify-content:flex-end"><button class="btn-primary" onclick="addEquipment()">Add Gear</button></div>
        </div>
      </div>
      <div id="manage-list"></div>
    </div>
  </main>
</div>

<script>
  let isAdmin = false;
  const ADMIN_PASS = 'admin123';
  const EQUIP_KEY = 'labbook_equip';
  const BOOK_KEY = 'labbook_bookings';
  const SLOTS = ['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'];
  
  let equipList = JSON.parse(localStorage.getItem(EQUIP_KEY)) || [
    { id: '1', name: 'Centrifuge', desc: 'High-speed microcentrifuge', icon: 'ti-refresh' },
    { id: '2', name: 'PCR Machine', desc: 'Thermal cycler', icon: 'ti-temperature' }
  ];
  let bookings = JSON.parse(localStorage.getItem(BOOK_KEY)) || [];
  let selEquip = null;
  let selSlot = null;

  function load() {
    const today = new Date();
    document.getElementById('current-date').textContent = today.toDateString();
    document.getElementById('book-date').value = today.toISOString().split('T')[0];
    renderEquipGrid(); renderRecords(); renderManage();
  }

  function save() {
    localStorage.setItem(EQUIP_KEY, JSON.stringify(equipList));
    localStorage.setItem(BOOK_KEY, JSON.stringify(bookings));
  }

  function toggleAuth() {
    if (isAdmin) {
      isAdmin = false;
      document.getElementById('admin-nav').style.display = 'none';
      document.getElementById('auth-btn').innerHTML = '<i class="ti ti-lock"></i> Admin Login';
      switchTab('book');
    } else {
      const pass = prompt("Enter Admin Password:");
      if (pass === ADMIN_PASS) {
        isAdmin = true;
        document.getElementById('admin-nav').style.display = 'block';
        document.getElementById('auth-btn').innerHTML = '<i class="ti ti-lock-open"></i> Logout';
      } else { alert("Wrong password!"); }
    }
    renderRecords(); renderManage();
  }

  function renderEquipGrid() {
    const g = document.getElementById('equip-grid');
    const today = new Date().toISOString().split('T')[0];
    g.innerHTML = equipList.map(e => {
      const busy = bookings.some(b => b.equipId === e.id && b.date === today);
      return `<div class="equip-card ${selEquip === e.id ? 'selected' : ''}" onclick="selectEquip('${e.id}')">
        <i class="ti ${e.icon}"></i><div class="equip-name">${e.name}</div><div class="equip-desc">${e.desc}</div>
        <span class="equip-status ${busy ? 'status-busy' : 'status-avail'}">${busy ? 'Busy today' : 'Available'}</span>
      </div>`;
    }).join('');
  }

  function selectEquip(id) {
    selEquip = id; selSlot = null; renderEquipGrid();
    document.getElementById('booking-form').style.display = 'block';
    renderSlots();
  }

  function renderSlots() {
    const date = document.getElementById('book-date').value;
    const dur = parseInt(document.getElementById('duration').value);
    const g = document.getElementById('slots-grid');
    g.innerHTML = SLOTS.map(slot => {
      const si = SLOTS.indexOf(slot);
      const booked = bookings.some(b => b.equipId === selEquip && b.date === date && (si < SLOTS.indexOf(b.slot) + parseInt(b.duration) && si + dur > SLOTS.indexOf(b.slot)));
      return `<div class="slot ${booked ? 'booked' : ''} ${selSlot === slot ? 'selected-slot' : ''}" onclick="${booked ? '' : `selectSlot('${slot}')`}">
        ${slot}${dur > 1 ? `<div style="font-size:10px">→ ${SLOTS[si+dur-1]||'18:00'}</div>` : ''}
      </div>`;
    }).join('');
    updateBtn();
  }

  function selectSlot(s) { selSlot = s; renderSlots(); }
  function updateBtn() { document.getElementById('confirm-btn').disabled = !selSlot; }

  function confirmBooking() {
    const name = document.getElementById('user-name').value;
    const dept = document.getElementById('user-dept').value;
    const date = document.getElementById('book-date').value;
    if (!name || !dept) return alert("Fill Name and Dept!");
    const eq = equipList.find(e => e.id === selEquip);
    bookings.push({ id: Date.now().toString(), equipId: selEquip, equipName: eq.name, name, dept, date, slot: selSlot, duration: document.getElementById('duration').value, purpose: document.getElementById('purpose').value || '—' });
    save(); showAlert("Confirmed!", "success"); renderRecords(); renderEquipGrid();
    document.getElementById('booking-form').style.display = 'none';
  }

  function renderRecords() {
    const tbody = document.getElementById('records-tbody');
    document.getElementById('th-del').style.display = isAdmin ? '' : 'none';
    tbody.innerHTML = bookings.map(b => `
      <tr><td>${b.equipName}</td><td>${b.name}</td><td>${b.dept}</td><td>${b.date}</td><td>${b.slot}</td><td>${b.duration}h</td><td>${b.purpose}</td>
      ${isAdmin ? `<td><button class="del-btn" onclick="deleteBooking('${b.id}')"><i class="ti ti-trash"></i></button></td>` : ''}</tr>
    `).reverse().join('');
    updateStats();
  }

  function deleteBooking(id) { if(confirm("Delete booking?")) { bookings = bookings.filter(b => b.id !== id); save(); renderRecords(); renderEquipGrid(); } }

  function renderManage() {
    const list = document.getElementById('manage-list');
    list.innerHTML = equipList.map(e => `
      <div class="stat-card" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px">
        <div><b>${e.name}</b><br><small>${e.desc}</small></div>
        <button class="del-btn" onclick="removeEquip('${e.id}')"><i class="ti ti-trash"></i></button>
      </div>
    `).join('');
  }

  function addEquipment() {
    const name = document.getElementById('new-name').value;
    if(!name) return;
    equipList.push({ id: Date.now().toString(), name, desc: document.getElementById('new-desc').value, icon: document.getElementById('new-icon').value });
    save(); renderManage(); renderEquipGrid();
  }

  function removeEquip(id) { equipList = equipList.filter(e => e.id !== id); save(); renderManage(); renderEquipGrid(); }

  function updateStats() {
    document.getElementById('stats-row').innerHTML = [
      { v: bookings.length, l: 'Total Bookings' },
      { v: new Set(bookings.map(b => b.name)).size, l: 'Unique Users' }
    ].map(s => `<div class="stat-card"><div class="stat-val">${s.v}</div><div class="stat-lbl">${s.l}</div></div>`).join('');
  }

  function exportCSV() {
    let csv = "Equip,User,Dept,Date,Slot,Duration,Purpose\n";
    bookings.forEach(b => csv += `"${b.equipName}","${b.name}","${b.dept}","${b.date}","${b.slot}","${b.duration}","${b.purpose}"\n`);
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'lab_bookings.csv'; a.click();
  }

  function switchTab(t) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('tab-'+t).classList.add('active');
    event.currentTarget.classList.add('active');
  }

  function showAlert(m, t) {
    const b = document.getElementById('alert-box'); b.className = 'alert alert-'+t; b.innerHTML = m; b.style.display = 'flex';
    setTimeout(() => b.style.display = 'none', 3000);
  }

  load();
</script>
</body>
</html>
