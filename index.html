<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>Lab Equipment Booking System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-50: #E1F5EE; --green-100: #9FE1CB; --green-600: #0F6E56; --green-700: #1D9E75;
      --blue-50: #E6F1FB; --blue-600: #185FA5; --amber-50: #FAEEDA; --amber-600: #854F0B;
      --pink-50: #FBEAF0; --pink-600: #993556; --lime-50: #EAF3DE; --lime-600: #3B6D11;
      --red-50: #FCEBEB; --red-600: #A32D2D; --red-100: #F7C1C1;
      --gray-50: #F7F6F3; --gray-100: #EDEDEA; --gray-200: #D3D1C7; --gray-500: #888780;
      --gray-800: #2C2C2A; --text-primary: #1a1a18; --text-secondary: #5F5E5A;
      --text-tertiary: #888780; --border: rgba(0,0,0,0.12); --border-strong: rgba(0,0,0,0.22);
      --surface: #ffffff; --surface-secondary: #F7F6F3;
      --radius-md: 8px; --radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text-primary: #F0EFEA; --text-secondary: #B4B2A9; --text-tertiary: #888780;
        --border: rgba(255,255,255,0.12); --border-strong: rgba(255,255,255,0.22);
        --surface: #1e1e1c; --surface-secondary: #2a2a28; --gray-50: #2a2a28; --gray-100: #333331;
      }
    }

    body { font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif; background: var(--surface-secondary); color: var(--text-primary); min-height: 100vh; }
    .topbar { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 0 2rem; display: flex; align-items: center; gap: 12px; height: 60px; position: sticky; top: 0; z-index: 100; }
    .topbar-icon { width: 34px; height: 34px; background: var(--green-50); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; }
    .topbar-icon i { font-size: 18px; color: var(--green-600); }
    .topbar h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
    .layout { display: flex; min-height: calc(100vh - 60px); }
    .sidebar { width: 200px; background: var(--surface); border-right: 0.5px solid var(--border); padding: 1.5rem 1rem; flex-shrink: 0; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius-md); font-size: 14px; cursor: pointer; color: var(--text-secondary); transition: all 0.15s; margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left; }
    .nav-item.active { background: var(--green-50); color: var(--green-600); font-weight: 500; }
    .nav-label { font-size: 10px; text-transform: uppercase; color: var(--text-tertiary); font-weight: 500; padding: 0 12px; margin: 1.2rem 0 6px; }
    .main { flex: 1; padding: 2rem; max-width: 1000px; }
    .section { display: none; } .section.active { display: block; }
    .page-title { font-size: 20px; font-weight: 600; margin-bottom: 1.5rem; }
    .equip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
    .equip-card { border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem; cursor: pointer; background: var(--surface); transition: all 0.15s; }
    .equip-card.selected { border: 2px solid var(--green-700); background: var(--green-50); }
    .equip-name { font-size: 13px; font-weight: 500; }
    .equip-status { font-size: 10px; margin-top: 10px; padding: 2px 8px; border-radius: 20px; display: inline-block; font-weight: 500; }
    .status-avail { background: var(--lime-50); color: var(--lime-600); }
    .status-busy { background: var(--red-50); color: var(--red-600); }
    .form-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 1rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group input, .form-group select { padding: 9px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--surface); color: var(--text-primary); }
    .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; margin-bottom: 1.2rem; }
    .slot { padding: 8px 6px; border: 0.5px solid var(--border); border-radius: var(--radius-md); text-align: center; font-size: 11px; cursor: pointer; background: var(--surface); }
    .slot.selected-slot { border: 2px solid var(--green-700); background: var(--green-50); color: var(--green-600); }
    .slot.booked { background: var(--gray-50); color: var(--text-tertiary); cursor: not-allowed; }
    .btn-primary { padding: 10px 22px; background: var(--green-700); color: white; border: none; border-radius: var(--radius-md); cursor: pointer; font-weight: 500; }
    .records-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .records-table th { padding: 10px 14px; text-align: left; color: var(--text-secondary); border-bottom: 0.5px solid var(--border); text-transform: uppercase; }
    .records-table td { padding: 11px 14px; border-bottom: 0.5px solid var(--border); }
    .del-btn { background: none; border: none; color: var(--text-tertiary); cursor: pointer; font-size: 16px; }
    .del-btn:hover { color: var(--red-600); }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-icon"><i class="ti ti-flask"></i></div>
  <h1>AB Lab Instrument Booking</h1>
  <p id="current-date" style="margin-left:auto; font-size:12px; color:var(--text-secondary)"></p>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="nav-label">Booking</div>
    <button class="nav-item active" id="nav-book" onclick="switchTab('book')"><i class="ti ti-calendar-plus"></i> Book Equipment</button>
    <button class="nav-item" id="nav-records" onclick="switchTab('records')"><i class="ti ti-clipboard-list"></i> Records</button>
    <div id="admin-nav" style="display:none">
        <div class="nav-label">Admin</div>
        <button class="nav-item" id="nav-manage" onclick="switchTab('manage')"><i class="ti ti-settings"></i> Manage</button>
    </div>
    <div class="nav-label" style="margin-top:2rem">Access</div>
    <button class="nav-item" id="auth-btn" onclick="toggleAuth()"><i class="ti ti-lock"></i> Admin Login</button>
  </aside>

  <main class="main">
    <div id="tab-book" class="section active">
      <div class="page-title">Book Equipment</div>
      <div class="equip-grid" id="equip-grid"></div>
      <div class="form-card" id="booking-form" style="display:none">
        <h3 id="form-title" style="margin-bottom:1rem">Select Details</h3>
        <div class="form-row">
          <div class="form-group"><label>Your name</label><input type="text" id="user-name" placeholder="Sameer Mushtaq" /></div>
          <div class="form-group"><label>Department / Lab</label><input type="text" id="dept-name" placeholder="Genomics Lab" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Purpose</label><input type="text" id="purpose" placeholder="HI-C Data Analysis /></div>
          <div class="form-group"><label>Date</label><input type="date" id="book-date" onchange="renderSlots()" /></div>
        </div>
        <div class="form-group" style="margin-bottom:1rem">
          <label>Duration</label>
          <select id="duration" onchange="renderSlots()">
            <option value="1">1 hour</option><option value="2">2 hours</option><option value="3">3 hours</option><option value="4">4 hours</option>
          </select>
        </div>
        <div class="slots-grid" id="slots-grid"></div>
        <button class="btn-primary" id="confirm-btn" onclick="confirmBooking()" disabled>Confirm Booking</button>
      </div>
    </div>

    <div id="tab-records" class="section">
      <div class="page-title">Global Records</div>
      <div class="form-card" style="padding:0; overflow:hidden">
        <table class="records-table">
          <thead>
            <tr><th>Equipment</th><th>User</th><th>Dept</th><th>Date</th><th>Slot</th><th>Hrs</th><th>Purpose</th><th id="th-admin" style="display:none"></th></tr>
          </thead>
          <tbody id="records-tbody"></tbody>
        </table>
      </div>
    </div>

    <div id="tab-manage" class="section">
      <div class="page-title">Manage Equipment</div>
      <div class="form-card">
        <h3>Add New Instrument</h3>
        <div class="form-row">
          <input type="text" id="new-name" placeholder="Name" />
          <input type="text" id="new-desc" placeholder="Description" />
        </div>
        <button class="btn-primary" onclick="addEquipment()">Add to Database</button>
      </div>
      <div id="manage-list"></div>
    </div>
  </main>
</div>

<script>
  // --- CONFIGURATION ---
  const SUPABASE_URL = 'https://bnyoriririjcavptmall.supabase.co'; 
  const SUPABASE_ANON_KEY = 'sb_publishable_VEYDiiSdkehKrzJRiYIjzA_RMe-4pNm';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const ADMIN_PASS = 'admin123'; 

 // Update the SLOTS to a 12-hour AM/PM format
const SLOTS = ['08:00 AM','09:00 AM','10:00 AM','11:00 AM','12:00 PM','01:00 PM','02:00 PM','03:00 PM','04:00 PM','05:00 PM'];

function renderSlots() {
    if (!selEquip) return;
    const date = document.getElementById('book-date').value;
    const dur = parseInt(document.getElementById('duration').value);
    const g = document.getElementById('slots-grid');
    
    g.innerHTML = SLOTS.map(slot => {
      const booked = isSlotBooked(selEquip, date, slot, dur);
      const isSel = selSlot === slot;
      
      // Keep the slot display as is, but it will now use the AM/PM strings from the array
      return `<div class="slot ${booked ? 'booked' : ''} ${isSel ? 'selected-slot' : ''}" 
                   onclick="${booked ? '' : `selectSlot('${slot}')`}">${slot}</div>`;
    }).join('');
    updateBtn();
}
  
  function formatDate(d) {
    if (!d) return "";
    // This splits the database date (2026-05-07) 
    const dateParts = d.split('-');
    if (dateParts.length !== 3) return d;
    
    const year = dateParts[0].substring(2); // Gets '26' from '2026'
    const month = dateParts[1];
    const day = dateParts[2];
    
    // Returns the format DD/MM/YY
    return `${day}/${month}/${year}`;
}

  let equipList = [];
  let bookings = [];
  let selEquip = null;
  let selSlot = null;
  let isAdmin = false;

  async function load() {
    const { data: eqData } = await _supabase.from('equipment').select('*');
    const { data: bkData } = await _supabase.from('bookings').select('*');
    equipList = eqData || [];
    bookings = bkData || [];
    
    // Updated Topbar Date Format
    const today = new Date();
    const dd = String(today.getDate()).padStart(2, '0');
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const yy = String(today.getFullYear()).substring(2);
    document.getElementById('current-date').textContent = `${dd}/${mm}/${yy}`;
    
    document.getElementById('book-date').value = todayStr();
    document.getElementById('book-date').min = todayStr();
    renderEquipGrid(); renderRecords(); renderManage();
}

  async function sync() {
    const { data: eqData } = await _supabase.from('equipment').select('*');
    const { data: bkData } = await _supabase.from('bookings').select('*');
    equipList = eqData || []; bookings = bkData || [];
  }

  function toggleAuth() {
    if (isAdmin) {
      isAdmin = false;
      document.getElementById('admin-nav').style.display = 'none';
      document.getElementById('auth-btn').innerHTML = '<i class="ti ti-lock"></i> Admin Login';
    } else {
      const pass = prompt("Admin Password:");
      if (pass === ADMIN_PASS) {
        isAdmin = true;
        document.getElementById('admin-nav').style.display = 'block';
        document.getElementById('auth-btn').innerHTML = '<i class="ti ti-lock-open"></i> Logout';
      }
    }
    renderRecords();
  }

  function isSlotBooked(eqId, date, slot, dur) {
    const si = SLOTS.indexOf(slot);
    const newStart = si;
    const newEnd = si + parseInt(dur);
    return bookings.some(b => {
      if (b.equip_id !== eqId || b.book_date !== date) return false;
      const bi = SLOTS.indexOf(b.slot);
      return (newStart < bi + parseInt(b.duration)) && (newEnd > bi);
    });
  }

  function renderEquipGrid() {
    const g = document.getElementById('equip-grid');
    const today = new Date().toISOString().split('T')[0];
    g.innerHTML = equipList.map(e => {
      const busy = bookings.some(b => b.equip_id === e.id && b.book_date === today);
      return `<div class="equip-card ${selEquip === e.id ? 'selected' : ''}" onclick="selectEquip('${e.id}')">
        <i class="ti ${e.icon || 'ti-flask'}"></i><div class="equip-name">${e.name}</div>
        <span class="equip-status ${busy ? 'status-busy' : 'status-avail'}">${busy ? 'In Use' : 'Available'}</span>
      </div>`;
    }).join('');
  }

  function selectEquip(id) {
    selEquip = id; selSlot = null; renderEquipGrid();
    document.getElementById('booking-form').style.display = 'block';
    renderSlots();
  }

  function renderSlots() {
    if (!selEquip) return;
    const date = document.getElementById('book-date').value;
    const dur = parseInt(document.getElementById('duration').value);
    const g = document.getElementById('slots-grid');
    g.innerHTML = SLOTS.map(slot => {
      const booked = isSlotBooked(selEquip, date, slot, dur);
      const isSel = selSlot === slot;
      return `<div class="slot ${booked ? 'booked' : ''} ${isSel ? 'selected-slot' : ''}" onclick="${booked ? '' : `selectSlot('${slot}')`}">${slot}</div>`;
    }).join('');
    document.getElementById('confirm-btn').disabled = !selSlot;
  }

  function selectSlot(slot) { selSlot = slot; renderSlots(); }

  async function confirmBooking() {
    const gear = equipList.find(e => e.id === selEquip);
    const b = {
      id: Date.now().toString(), equip_id: selEquip, equip_name: gear.name,
      user_name: document.getElementById('user-name').value, 
      dept_name: document.getElementById('dept-name').value, 
      purpose: document.getElementById('purpose').value, 
      book_date: document.getElementById('book-date').value,
      slot: selSlot, duration: document.getElementById('duration').value
    };
    const { error } = await _supabase.from('bookings').insert([b]);
    if(error) alert(error.message);
    else { await sync(); alert('Booked!'); switchTab('records'); }
  }

  function renderRecords() {
    document.getElementById('th-admin').style.display = isAdmin ? '' : 'none';
    const tbody = document.getElementById('records-tbody');
    tbody.innerHTML = bookings.map(b => `
      <tr>
        <td><b>${b.equip_name}</b></td><td>${b.user_name}</td><td>${b.dept_name}</td>
        <td>${b.book_date}</td><td>${b.slot}</td><td>${b.duration}h</td><td>${b.purpose}</td>
        ${isAdmin ? `<td><button class="del-btn" onclick="deleteBooking('${b.id}')"><i class="ti ti-trash"></i></button></td>` : ''}
      </tr>
    `).reverse().join('');
  }

  async function deleteBooking(id) {
    if(!confirm("Delete?")) return;
    await _supabase.from('bookings').delete().eq('id', id);
    await sync(); renderRecords();
  }

  function renderManage() {
    document.getElementById('manage-list').innerHTML = equipList.map(e => `
      <div class="manage-equip-row" style="padding:10px; border-bottom:1px solid #eee; display:flex; justify-content:space-between">
        <span>${e.name}</span><button class="del-btn" onclick="removeEquip('${e.id}')"><i class="ti ti-trash"></i></button>
      </div>
    `).join('');
  }

  async function addEquipment() {
    const e = { id: Date.now().toString(), name: document.getElementById('new-name').value, description: document.getElementById('new-desc').value, icon: 'ti-flask' };
    await _supabase.from('equipment').insert([e]);
    await sync(); renderEquipGrid(); renderManage();
  }

  async function removeEquip(id) {
    if(!confirm("Remove?")) return;
    await _supabase.from('equipment').delete().eq('id', id);
    await sync(); renderEquipGrid(); renderManage();
  }

  function switchTab(tab) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    document.getElementById('nav-' + tab).classList.add('active');
    if (tab === 'records') renderRecords();
  }

  load();
</script>
</body>
</html>
