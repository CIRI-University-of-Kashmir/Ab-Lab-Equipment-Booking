<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>Lab Equipment Booking System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-50: #E1F5EE;
      --green-100: #9FE1CB;
      --green-600: #0F6E56;
      --green-700: #1D9E75;
      --blue-50: #E6F1FB;
      --blue-600: #185FA5;
      --amber-50: #FAEEDA;
      --amber-600: #854F0B;
      --pink-50: #FBEAF0;
      --pink-600: #993556;
      --lime-50: #EAF3DE;
      --lime-600: #3B6D11;
      --red-50: #FCEBEB;
      --red-600: #A32D2D;
      --red-100: #F7C1C1;
      --gray-50: #F7F6F3;
      --gray-100: #EDEDEA;
      --gray-200: #D3D1C7;
      --gray-500: #888780;
      --gray-800: #2C2C2A;
      --text-primary: #1a1a18;
      --text-secondary: #5F5E5A;
      --text-tertiary: #888780;
      --border: rgba(0,0,0,0.12);
      --border-strong: rgba(0,0,0,0.22);
      --surface: #ffffff;
      --surface-secondary: #F7F6F3;
      --radius-md: 8px; /* Fixed: Removed # */
      --radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text-primary: #F0EFEA;
        --text-secondary: #B4B2A9;
        --text-tertiary: #888780;
        --border: rgba(255,255,255,0.12);
        --border-strong: rgba(255,255,255,0.22);
        --surface: #1e1e1c;
        --surface-secondary: #2a2a28;
        --gray-50: #2a2a28;
        --gray-100: #333331;
      }
    }

    body {
      font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
      background: var(--surface-secondary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    .topbar {
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-icon {
      width: 34px; height: 34px;
      background: var(--green-50);
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
    }
    .topbar-icon i { font-size: 18px; color: var(--green-600); }
    .topbar h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
    .topbar p { font-size: 12px; color: var(--text-secondary); margin-left: auto; }

    .layout { display: flex; min-height: calc(100vh - 60px); }

    .sidebar {
      width: 200px;
      background: var(--surface);
      border-right: 0.5px solid var(--border);
      padding: 1.5rem 1rem;
      flex-shrink: 0;
    }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      font-size: 14px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.15s;
      margin-bottom: 2px;
      border: none; background: none; width: 100%; text-align: left;
    }
    .nav-item i { font-size: 17px; }
    .nav-item:hover { background: var(--gray-50); color: var(--text-primary); }
    .nav-item.active { background: var(--green-50); color: var(--green-600); font-weight: 500; }

    .nav-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-tertiary); font-weight: 500;
      padding: 0 12px; margin: 1.2rem 0 6px;
    }

    .main { flex: 1; padding: 2rem; max-width: 900px; }
    .section { display: none; }
    .section.active { display: block; }
    .page-title { font-size: 20px; font-weight: 600; margin-bottom: 1.5rem; letter-spacing: -0.02em; }

    .equip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
    .equip-card {
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1rem;
      cursor: pointer;
      background: var(--surface);
      transition: all 0.15s;
    }
    .equip-card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
    .equip-card.selected { border: 2px solid var(--green-700); background: var(--green-50); }

    .equip-card i { font-size: 24px; color: var(--green-600); margin-bottom: 8px; display: block; }
    .equip-name { font-size: 13px; font-weight: 500; }
    .equip-desc { font-size: 11px; color: var(--text-secondary); margin-top: 3px; }
    .equip-status { font-size: 10px; margin-top: 10px; padding: 2px 8px; border-radius: 20px; display: inline-block; font-weight: 500; }
    .status-avail { background: var(--lime-50); color: var(--lime-600); }
    .status-busy { background: var(--red-50); color: var(--red-600); }

    .form-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 1rem; }
    .form-card h3 { font-size: 15px; font-weight: 500; margin-bottom: 1.2rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
    .form-group input, .form-group select { padding: 9px 12px; border: 0.5px solid var(--border-strong); border-radius: var(--radius-md); font-size: 13px; font-family: inherit; color: var(--text-primary); background: var(--surface); transition: border-color 0.15s; }

    .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; margin-bottom: 1.2rem; }
    .slot { padding: 8px 6px; border: 0.5px solid var(--border); border-radius: var(--radius-md); text-align: center; font-size: 12px; cursor: pointer; transition: all 0.15s; background: var(--surface); color: var(--text-primary); }
    .slot:hover:not(.booked) { border-color: var(--green-700); background: var(--green-50); color: var(--green-600); }
    .slot.selected-slot { border: 2px solid var(--green-700); background: var(--green-50); color: var(--green-600); font-weight: 600; }
    .slot.booked { background: var(--gray-50); color: var(--text-tertiary); cursor: not-allowed; }

    .btn-primary { padding: 10px 22px; background: var(--green-700); color: white; border: none; border-radius: var(--radius-md); font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; }
    .btn-ghost { padding: 8px 16px; background: none; border: 0.5px solid var(--border-strong); border-radius: var(--radius-md); font-size: 13px; cursor: pointer; color: var(--text-primary); transition: background 0.15s; }

    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
    .stat-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; }
    .stat-val { font-size: 24px; font-weight: 600; color: var(--green-600); }
    .stat-lbl { font-size: 11px; color: var(--text-secondary); margin-top: 3px; }

    .records-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .records-table th { padding: 10px 14px; text-align: left; color: var(--text-secondary); font-size: 11px; text-transform: uppercase; border-bottom: 0.5px solid var(--border); }
    .records-table td { padding: 11px 14px; border-bottom: 0.5px solid var(--border); color: var(--text-primary); }
    .badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; display: inline-block; font-weight: 500; }
    .del-btn { background: none; border: none; color: var(--text-tertiary); cursor: pointer; font-size: 16px; padding: 4px 6px; border-radius: 6px; }

    .manage-equip-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 0.5px solid var(--border); }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-icon"><i class="ti ti-flask"></i></div>
  <h1>Lab Equipment Booking</h1>
  <p id="current-date"></p>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="nav-label">Booking</div>
    <button class="nav-item active" id="nav-book" onclick="switchTab('book')">
      <i class="ti ti-calendar-plus"></i> Book Equipment
    </button>
    <div class="nav-label">Data</div>
    <button class="nav-item" id="nav-records" onclick="switchTab('records')">
      <i class="ti ti-clipboard-list"></i> Records
    </button>
    <div id="admin-nav" style="display:none">
        <div class="nav-label">Admin</div>
        <button class="nav-item" id="nav-manage" onclick="switchTab('manage')">
          <i class="ti ti-settings"></i> Manage
        </button>
    </div>
    <div class="nav-label" style="margin-top:2rem">Access</div>
    <button class="nav-item" id="auth-btn" onclick="toggleAuth()">
      <i class="ti ti-lock"></i> Admin Login
    </button>
  </aside>

  <main class="main">
    <div id="tab-book" class="section active">
      <div class="page-title">Book Equipment</div>
      <div id="alert-box" style="display:none"></div>
      <div class="equip-grid" id="equip-grid"></div>
      <div class="form-card" id="booking-form" style="display:none">
        <h3 id="form-title">Select a time slot</h3>
        <div class="form-row">
          <div class="form-group"><label>Your name</label><input type="text" id="user-name" placeholder="Dr. Sameer Tantray" /></div>
          <div class="form-group"><label>Department / Lab</label><input type="text" id="dept-name" placeholder="e.g. Genomics Lab" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Purpose / Experiment</label><input type="text" id="purpose" placeholder="e.g. Hi-C data analysis" /></div>
          <div class="form-group"><label>Date</label><input type="date" id="book-date" onchange="renderSlots()" /></div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Duration</label>
            <select id="duration" onchange="renderSlots()">
              <option value="1">1 hour</option><option value="2">2 hours</option><option value="3">3 hours</option><option value="4">4 hours</option>
            </select>
          </div>
        </div>
        <div class="slots-grid" id="slots-grid"></div>
        <button class="btn-primary" id="confirm-btn" onclick="confirmBooking()" disabled>Confirm Booking</button>
      </div>
    </div>

    <div id="tab-records" class="section">
      <div class="page-title">Booking Records</div>
      <div class="stats-row" id="stats-row"></div>
      <div class="toolbar" style="display:flex; gap:8px; margin-bottom:1rem">
        <input type="text" id="search-input" placeholder="Search..." oninput="renderRecords()" style="flex:1; padding:8px; border-radius:8px; border:1px solid var(--border)" />
        <button class="btn-ghost" onclick="exportCSV()"><i class="ti ti-download"></i> CSV</button>
      </div>
      <div class="table-wrap" style="background:var(--surface); border-radius:12px; border:1px solid var(--border); overflow:hidden">
        <table class="records-table">
          <thead>
            <tr><th>Equipment</th><th>Booked by</th><th>Dept/Lab</th><th>Date</th><th>Slot</th><th>Hrs</th><th>Purpose</th><th id="th-admin" style="display:none">Action</th></tr>
          </thead>
          <tbody id="records-tbody"></tbody>
        </table>
      </div>
    </div>

    <div id="tab-manage" class="section">
      <div class="page-title">Manage Equipment</div>
      <div class="form-card">
        <h3>Add new equipment</h3>
        <div class="form-row">
          <div class="form-group"><label>Name</label><input type="text" id="new-name" /></div>
          <div class="form-group"><label>Description</label><input type="text" id="new-desc" /></div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Icon</label>
            <select id="new-icon">
              <option value="ti-refresh">Centrifuge</option><option value="ti-camera">Gel Doc</option><option value="ti-temperature">PCR</option><option value="ti-microscope">Microscope</option><option value="ti-cpu">Computing</option>
            </select>
          </div>
          <div class="form-group" style="justify-content:flex-end;"><button class="btn-primary" onclick="addEquipment()">Add</button></div>
        </div>
      </div>
      <div class="form-card"><h3>Current equipment</h3><div id="manage-list"></div></div>
    </div>
  </main>
</div>

<script>
  // --- SUPABASE CONFIGURATION ---
  // --- SUPABASE CONFIGURATION ---
  const SUPABASE_URL = 'https://bnyoriririjcavptmall.supabase.co/rest/v1/'; 
  const SUPABASE_ANON_KEY = 'sb_publishable_VEYDiiSdkehKrzJRiYIjzA_RMe-4pNm';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const ADMIN_PASS = 'admin123'; 
  const SLOTS = ['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'];
  const EQUIP_PALETTE = [{ bg: '#E1F5EE', text: '#0F6E56' },{ bg: '#E6F1FB', text: '#185FA5' },{ bg: '#FAEEDA', text: '#854F0B' },{ bg: '#FBEAF0', text: '#993556' }];

  let equipList = [];
  let bookings = [];
  let selEquip = null;
  let selSlot = null;
  let isAdmin = false;

  async function load() {
    const { data: eqData } = await _supabase.from('equipment').select('*');
    const { data: bkData } = await _supabase.from('bookings').select('*');
    equipList = eqData || [];
    bookings = bkData || [];
    document.getElementById('current-date').textContent = new Date().toDateString();
    document.getElementById('book-date').value = todayStr();
    document.getElementById('book-date').min = todayStr();
    renderEquipGrid(); renderRecords(); renderManage();
  }

  async function sync() {
    const { data: eqData } = await _supabase.from('equipment').select('*');
    const { data: bkData } = await _supabase.from('bookings').select('*');
    equipList = eqData || []; bookings = bkData || [];
  }

  function toggleAuth() {
    if (isAdmin) {
      isAdmin = false;
      document.getElementById('admin-nav').style.display = 'none';
      document.getElementById('auth-btn').innerHTML = '<i class="ti ti-lock"></i> Admin Login';
      switchTab('book');
    } else {
      const pass = prompt("Enter Admin Password:");
      if (pass === ADMIN_PASS) {
        isAdmin = true;
        document.getElementById('admin-nav').style.display = 'block';
        document.getElementById('auth-btn').innerHTML = '<i class="ti ti-lock-open"></i> Logout';
      }
    }
    renderRecords();
  }

  function todayStr() { return new Date().toISOString().split('T')[0]; }
  function palette(idx) { return EQUIP_PALETTE[idx % EQUIP_PALETTE.length]; }

  function isSlotBooked(eqId, date, slot, dur) {
    const si = SLOTS.indexOf(slot);
    return bookings.some(b => {
      if (b.equip_id !== eqId || b.book_date !== date) return false;
      const bi = SLOTS.indexOf(b.slot);
      return si < bi + parseInt(b.duration) && si + parseInt(dur) > bi;
    });
  }

  function renderEquipGrid() {
    const g = document.getElementById('equip-grid');
    g.innerHTML = equipList.map((e, i) => {
      const busy = bookings.some(b => b.equip_id === e.id && b.book_date === todayStr());
      return `<div class="equip-card ${selEquip === e.id ? 'selected' : ''}" onclick="selectEquip('${e.id}')">
        <i class="ti ${e.icon}"></i><div class="equip-name">${e.name}</div>
        <span class="equip-status ${busy ? 'status-busy' : 'status-avail'}">${busy ? 'Busy' : 'Available'}</span>
      </div>`;
    }).join('');
  }

  function selectEquip(id) {
    selEquip = id; selSlot = null; renderEquipGrid();
    document.getElementById('booking-form').style.display = 'block';
    renderSlots();
  }

  function renderSlots() {
    if (!selEquip) return;
    const date = document.getElementById('book-date').value;
    const dur = parseInt(document.getElementById('duration').value);
    const g = document.getElementById('slots-grid');
    g.innerHTML = SLOTS.map(slot => {
      const booked = isSlotBooked(selEquip, date, slot, dur);
      return `<div class="slot ${booked ? 'booked' : ''} ${selSlot === slot ? 'selected-slot' : ''}" onclick="${booked ? '' : `selectSlot('${slot}')`}">${slot}</div>`;
    }).join('');
    updateBtn();
  }

  function selectSlot(slot) { selSlot = slot; renderSlots(); }
  function updateBtn() { document.getElementById('confirm-btn').disabled = !selSlot; }

  async function confirmBooking() {
    const b = {
      id: Date.now().toString(), equip_id: selEquip, equip_name: equipList.find(e=>e.id===selEquip).name,
      name: document.getElementById('user-name').value, dept: document.getElementById('dept-name').value,
      purpose: document.getElementById('purpose').value, book_date: document.getElementById('book-date').value,
      slot: selSlot, duration: document.getElementById('duration').value
    };
    await _supabase.from('bookings').insert([b]);
    await sync(); showAlert('Booked!', 'success'); switchTab('records');
  }

  function renderRecords() {
    document.getElementById('th-admin').style.display = isAdmin ? '' : 'none';
    const tbody = document.getElementById('records-tbody');
    tbody.innerHTML = bookings.map(b => `
      <tr><td>${b.equip_name}</td><td>${b.name}</td><td>${b.dept}</td><td>${b.book_date}</td><td>${b.slot}</td><td>${b.duration}</td><td>${b.purpose}</td>
      ${isAdmin ? `<td><button class="del-btn" onclick="deleteBooking('${b.id}')"><i class="ti ti-trash"></i></button></td>` : ''}</tr>
    `).join('');
    document.getElementById('stats-row').innerHTML = `<div class="stat-card"><div class="stat-val">${bookings.length}</div><div class="stat-lbl">Total</div></div>`;
  }

  async function deleteBooking(id) {
    await _supabase.from('bookings').delete().eq('id', id);
    await sync(); renderRecords();
  }

  function renderManage() {
    document.getElementById('manage-list').innerHTML = equipList.map(e => `
      <div class="manage-equip-row"><span>${e.name}</span><button class="del-btn" onclick="removeEquip('${e.id}')"><i class="ti ti-trash"></i></button></div>
    `).join('');
  }

  async function addEquipment() {
    const e = { id: Date.now().toString(), name: document.getElementById('new-name').value, description: document.getElementById('new-desc').value, icon: document.getElementById('new-icon').value };
    await _supabase.from('equipment').insert([e]);
    await sync(); renderEquipGrid(); renderManage();
  }

  async function removeEquip(id) {
    await _supabase.from('equipment').delete().eq('id', id);
    await sync(); renderEquipGrid(); renderManage();
  }

  function switchTab(tab) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    document.getElementById('nav-' + tab).classList.add('active');
    if (tab === 'records') renderRecords();
  }

  function showAlert(m, t) { alert(m); }
  function exportCSV() { /* Export logic */ }

  load();
</script>
</body>
</html>
