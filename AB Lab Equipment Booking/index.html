<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab Equipment Booking System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-50: #E1F5EE;
      --green-100: #9FE1CB;
      --green-600: #0F6E56;
      --green-700: #1D9E75;
      --blue-50: #E6F1FB;
      --blue-600: #185FA5;
      --amber-50: #FAEEDA;
      --amber-600: #854F0B;
      --pink-50: #FBEAF0;
      --pink-600: #993556;
      --lime-50: #EAF3DE;
      --lime-600: #3B6D11;
      --red-50: #FCEBEB;
      --red-600: #A32D2D;
      --red-100: #F7C1C1;
      --gray-50: #F7F6F3;
      --gray-100: #EDEDEA;
      --gray-200: #D3D1C7;
      --gray-500: #888780;
      --gray-800: #2C2C2A;
      --text-primary: #1a1a18;
      --text-secondary: #5F5E5A;
      --text-tertiary: #888780;
      --border: rgba(0,0,0,0.12);
      --border-strong: rgba(0,0,0,0.22);
      --surface: #ffffff;
      --surface-secondary: #F7F6F3;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text-primary: #F0EFEA;
        --text-secondary: #B4B2A9;
        --text-tertiary: #888780;
        --border: rgba(255,255,255,0.12);
        --border-strong: rgba(255,255,255,0.22);
        --surface: #1e1e1c;
        --surface-secondary: #2a2a28;
        --gray-50: #2a2a28;
        --gray-100: #333331;
      }
    }

    
    body {
      font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
      background: var(--surface-secondary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');

    .topbar {
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-icon {
      width: 34px; height: 34px;
      background: var(--green-50);
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
    }
    .topbar-icon i { font-size: 18px; color: var(--green-600); }
    .topbar h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
    .topbar p { font-size: 12px; color: var(--text-secondary); margin-left: auto; }

    .layout { display: flex; min-height: calc(100vh - 60px); }

    .sidebar {
      width: 200px;
      background: var(--surface);
      border-right: 0.5px solid var(--border);
      padding: 1.5rem 1rem;
      flex-shrink: 0;
    }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      font-size: 14px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.15s;
      margin-bottom: 2px;
      border: none; background: none; width: 100%; text-align: left;
    }
    .nav-item i { font-size: 17px; }
    .nav-item:hover { background: var(--gray-50); color: var(--text-primary); }
    .nav-item.active { background: var(--green-50); color: var(--green-600); font-weight: 500; }

    .nav-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-tertiary); font-weight: 500;
      padding: 0 12px; margin: 1.2rem 0 6px;
    }

    .main { flex: 1; padding: 2rem; max-width: 900px; }

    .section { display: none; }
    .section.active { display: block; }

    .page-title { font-size: 20px; font-weight: 600; margin-bottom: 1.5rem; letter-spacing: -0.02em; }

    /* Equipment Grid */
    .equip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }

    .equip-card {
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1rem;
      cursor: pointer;
      background: var(--surface);
      transition: all 0.15s;
    }
    .equip-card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
    .equip-card.selected { border: 2px solid var(--green-700); background: var(--green-50); }

    .equip-card i { font-size: 24px; color: var(--green-600); margin-bottom: 8px; display: block; }
    .equip-card.selected i { color: var(--green-600); }
    .equip-name { font-size: 13px; font-weight: 500; }
    .equip-desc { font-size: 11px; color: var(--text-secondary); margin-top: 3px; }
    .equip-status { font-size: 10px; margin-top: 10px; padding: 2px 8px; border-radius: 20px; display: inline-block; font-weight: 500; }
    .status-avail { background: var(--lime-50); color: var(--lime-600); }
    .status-busy { background: var(--red-50); color: var(--red-600); }

    /* Form */
    .form-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin-bottom: 1rem;
    }
    .form-card h3 { font-size: 15px; font-weight: 500; margin-bottom: 1.2rem; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    @media (max-width: 560px) { .form-row { grid-template-columns: 1fr; } }

    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
    .form-group input, .form-group select {
      padding: 9px 12px;
      border: 0.5px solid var(--border-strong);
      border-radius: var(--radius-md);
      font-size: 13px;
      font-family: inherit;
      color: var(--text-primary);
      background: var(--surface);
      transition: border-color 0.15s;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--green-700);
      box-shadow: 0 0 0 3px rgba(29,158,117,0.12);
    }

    /* Slots */
    .slots-label { font-size: 12px; color: var(--text-secondary); font-weight: 500; margin: 1rem 0 8px; }
    .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; margin-bottom: 1.2rem; }

    .slot {
      padding: 8px 6px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      text-align: center;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      background: var(--surface);
      color: var(--text-primary);
    }
    .slot:hover:not(.booked) { border-color: var(--green-700); background: var(--green-50); color: var(--green-600); }
    .slot.selected-slot { border: 2px solid var(--green-700); background: var(--green-50); color: var(--green-600); font-weight: 600; }
    .slot.booked { background: var(--gray-50); color: var(--text-tertiary); cursor: not-allowed; }
    .slot .sub { font-size: 10px; color: var(--text-tertiary); margin-top: 2px; }
    .slot.selected-slot .sub { color: var(--green-700); }

    /* Buttons */
    .btn-primary {
      padding: 10px 22px;
      background: var(--green-700);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn-primary:hover { background: var(--green-600); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-ghost {
      padding: 8px 16px;
      background: none;
      border: 0.5px solid var(--border-strong);
      border-radius: var(--radius-md);
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      color: var(--text-primary);
      transition: background 0.15s;
    }
    .btn-ghost:hover { background: var(--gray-50); }

    /* Alert */
    .alert { padding: 10px 14px; border-radius: var(--radius-md); font-size: 13px; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
    .alert-success { background: var(--lime-50); color: var(--lime-600); border: 0.5px solid #C0DD97; }
    .alert-error { background: var(--red-50); color: var(--red-600); border: 0.5px solid var(--red-100); }

    /* Records */
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
    .stat-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; }
    .stat-val { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; color: var(--green-600); }
    .stat-lbl { font-size: 11px; color: var(--text-secondary); margin-top: 3px; }

    .toolbar { display: flex; gap: 8px; margin-bottom: 1rem; }
    .toolbar input, .toolbar select {
      flex: 1; padding: 8px 12px;
      border: 0.5px solid var(--border-strong);
      border-radius: var(--radius-md);
      font-size: 13px;
      font-family: inherit;
      color: var(--text-primary);
      background: var(--surface);
    }
    .toolbar input:focus, .toolbar select:focus { outline: none; border-color: var(--green-700); }

    .table-wrap { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
    .records-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .records-table th { padding: 10px 14px; text-align: left; color: var(--text-secondary); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 0.5px solid var(--border); }
    .records-table td { padding: 11px 14px; border-bottom: 0.5px solid var(--border); color: var(--text-primary); }
    .records-table tr:last-child td { border-bottom: none; }
    .records-table tbody tr:hover td { background: var(--gray-50); }

    .badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; display: inline-block; font-weight: 500; }

    .del-btn { background: none; border: none; color: var(--text-tertiary); cursor: pointer; font-size: 16px; padding: 4px 6px; border-radius: 6px; line-height: 1; }
    .del-btn:hover { background: var(--red-50); color: var(--red-600); }

    .empty { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); }
    .empty i { font-size: 36px; display: block; margin-bottom: 10px; opacity: 0.3; }
    .empty p { font-size: 13px; }

    /* Manage */
    .manage-equip-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 0.5px solid var(--border); }
    .manage-equip-row:last-child { border-bottom: none; }
    .manage-equip-row i { font-size: 20px; }

    @media (max-width: 640px) {
      .sidebar { display: none; }
      .main { padding: 1rem; }
      .topbar { padding: 0 1rem; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-icon"><i class="ti ti-flask"></i></div>
  <h1>Lab Equipment Booking</h1>
  <p id="current-date"></p>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="nav-label">Booking</div>
    <button class="nav-item active" onclick="switchTab('book')">
      <i class="ti ti-calendar-plus"></i> Book Equipment
    </button>
    <div class="nav-label">Data</div>
    <button class="nav-item" onclick="switchTab('records')">
      <i class="ti ti-clipboard-list"></i> Records
    </button>
    <div class="nav-label">Admin</div>
    <button class="nav-item" onclick="switchTab('manage')">
      <i class="ti ti-settings"></i> Manage
    </button>
  </aside>

  <main class="main">

    <!-- BOOK TAB -->
    <div id="tab-book" class="section active">
      <div class="page-title">Book Equipment</div>
      <div id="alert-box" style="display:none"></div>

      <div class="equip-grid" id="equip-grid"></div>

      <div class="form-card" id="booking-form" style="display:none">
        <h3 id="form-title">Select a time slot</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Your name</label>
            <input type="text" id="user-name" placeholder="Dr. Priya Sharma" />
          </div>
          <div class="form-group">
            <label>Purpose / Experiment</label>
            <input type="text" id="purpose" placeholder="e.g. PCR analysis" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="book-date" onchange="renderSlots()" />
          </div>
          <div class="form-group">
            <label>Duration</label>
            <select id="duration" onchange="renderSlots()">
              <option value="1">1 hour</option>
              <option value="2">2 hours</option>
              <option value="3">3 hours</option>
              <option value="4">4 hours</option>
            </select>
          </div>
        </div>
        <div class="slots-label">Available time slots</div>
        <div class="slots-grid" id="slots-grid"></div>
        <button class="btn-primary" id="confirm-btn" onclick="confirmBooking()" disabled>Confirm Booking</button>
      </div>
    </div>

    <!-- RECORDS TAB -->
    <div id="tab-records" class="section">
      <div class="page-title">Booking Records</div>
      <div class="stats-row" id="stats-row"></div>
      <div class="toolbar">
        <input type="text" id="search-input" placeholder="Search by name, equipment, or purpose…" oninput="renderRecords()" />
        <select id="filter-equip" onchange="renderRecords()">
          <option value="">All equipment</option>
        </select>
        <button class="btn-ghost" onclick="exportCSV()"><i class="ti ti-download" style="vertical-align:-2px;margin-right:4px"></i>Export CSV</button>
      </div>
      <div class="table-wrap">
        <table class="records-table">
          <thead>
            <tr>
              <th>Equipment</th>
              <th>Booked by</th>
              <th>Date</th>
              <th>Slot</th>
              <th>Hrs</th>
              <th>Purpose</th>
              <th>Booked on</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="records-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- MANAGE TAB -->
    <div id="tab-manage" class="section">
      <div class="page-title">Manage Equipment</div>
      <div class="form-card">
        <h3>Add new equipment</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Equipment name</label>
            <input type="text" id="new-name" placeholder="e.g. Western Blot System" />
          </div>
          <div class="form-group">
            <label>Description</label>
            <input type="text" id="new-desc" placeholder="e.g. Protein transfer unit" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Icon</label>
            <select id="new-icon">
              <option value="ti-refresh">Centrifuge (spinner)</option>
              <option value="ti-camera">Gel Doc (camera)</option>
              <option value="ti-temperature">PCR (temperature)</option>
              <option value="ti-microscope">Microscope</option>
              <option value="ti-flask">Flask / General</option>
              <option value="ti-droplet">Pipette / Liquid handler</option>
              <option value="ti-atom">Spectrophotometer</option>
              <option value="ti-wave-sine">Vortex mixer</option>
              <option value="ti-chart-histogram">Sequencer</option>
              <option value="ti-building-hospital">Other</option>
            </select>
          </div>
          <div class="form-group" style="justify-content:flex-end;">
            <button class="btn-primary" onclick="addEquipment()"><i class="ti ti-plus" style="vertical-align:-2px;margin-right:4px"></i>Add Equipment</button>
          </div>
        </div>
      </div>

      <div class="form-card">
        <h3>Current equipment</h3>
        <div id="manage-list"></div>
      </div>
    </div>

  </main>
</div>

<script>
  const EQUIP_KEY = 'labbook_equip';
  const BOOK_KEY = 'labbook_bookings';

  const EQUIP_PALETTE = [
    { bg: '#E1F5EE', text: '#0F6E56' },
    { bg: '#E6F1FB', text: '#185FA5' },
    { bg: '#FAEEDA', text: '#854F0B' },
    { bg: '#FBEAF0', text: '#993556' },
    { bg: '#EAF3DE', text: '#3B6D11' },
    { bg: '#FCEBEB', text: '#A32D2D' },
  ];

  const SLOTS = ['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'];

  const DEFAULT_EQUIP = [
    { id: 'centrifuge', name: 'Centrifuge', desc: 'High-speed microcentrifuge', icon: 'ti-refresh' },
    { id: 'gel-doc',    name: 'Gel Doc System', desc: 'UV gel documentation unit', icon: 'ti-camera' },
    { id: 'pcr',        name: 'PCR Machine', desc: 'Thermal cycler, 96-well', icon: 'ti-temperature' },
    { id: 'microscope', name: 'Microscope', desc: 'Fluorescence microscope', icon: 'ti-microscope' },
  ];

  let equipList = [];
  let bookings = [];
  let selEquip = null;
  let selSlot = null;

  function load() {
    try { equipList = JSON.parse(localStorage.getItem(EQUIP_KEY)) || DEFAULT_EQUIP; } catch { equipList = DEFAULT_EQUIP; }
    try { bookings = JSON.parse(localStorage.getItem(BOOK_KEY)) || []; } catch { bookings = []; }
    const today = new Date();
    document.getElementById('current-date').textContent = today.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    document.getElementById('book-date').value = todayStr();
    document.getElementById('book-date').min = todayStr();
    renderEquipGrid();
    renderRecords();
    renderManage();
  }

  function save() {
    localStorage.setItem(EQUIP_KEY, JSON.stringify(equipList));
    localStorage.setItem(BOOK_KEY, JSON.stringify(bookings));
  }

  function todayStr() {
    return new Date().toISOString().split('T')[0];
  }

  function formatDate(d) {
    return new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function palette(idx) { return EQUIP_PALETTE[idx % EQUIP_PALETTE.length]; }

  function isSlotBooked(eqId, date, slot, dur) {
    const si = SLOTS.indexOf(slot);
    return bookings.some(b => {
      if (b.equipId !== eqId || b.date !== date) return false;
      const bi = SLOTS.indexOf(b.slot);
      return si < bi + parseInt(b.duration) && si + parseInt(dur) > bi;
    });
  }

  function renderEquipGrid() {
    const g = document.getElementById('equip-grid');
    g.innerHTML = equipList.map((e, i) => {
      const todayHasBooking = bookings.some(b => b.equipId === e.id && b.date === todayStr());
      return `<div class="equip-card ${selEquip === e.id ? 'selected' : ''}" onclick="selectEquip('${e.id}')">
        <i class="ti ${e.icon}"></i>
        <div class="equip-name">${e.name}</div>
        <div class="equip-desc">${e.desc}</div>
        <span class="equip-status ${todayHasBooking ? 'status-busy' : 'status-avail'}">${todayHasBooking ? 'Has bookings today' : 'Available today'}</span>
      </div>`;
    }).join('');
  }

  function selectEquip(id) {
    selEquip = id;
    selSlot = null;
    renderEquipGrid();
    const eq = equipList.find(e => e.id === id);
    document.getElementById('form-title').textContent = 'Book: ' + eq.name;
    document.getElementById('booking-form').style.display = 'block';
    renderSlots();
    updateBtn();
  }

  function renderSlots() {
    if (!selEquip) return;
    const date = document.getElementById('book-date').value;
    const dur = parseInt(document.getElementById('duration').value);
    const g = document.getElementById('slots-grid');
    g.innerHTML = SLOTS.map(slot => {
      const booked = isSlotBooked(selEquip, date, slot, dur);
      const si = SLOTS.indexOf(slot);
      const endLabel = SLOTS[si + dur - 1] || '18:00';
      const isSel = selSlot === slot;
      return `<div class="slot ${booked ? 'booked' : ''} ${isSel ? 'selected-slot' : ''}" onclick="${booked ? '' : `selectSlot('${slot}')`}">
        <div>${slot}</div>
        ${dur > 1 ? `<div class="sub">→ ${endLabel}</div>` : ''}
        ${booked ? '<div class="sub">booked</div>' : ''}
      </div>`;
    }).join('');
    selSlot = null;
    updateBtn();
  }

  function selectSlot(slot) {
    selSlot = slot;
    document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected-slot'));
    const all = document.querySelectorAll('.slot:not(.booked)');
    all.forEach(s => { if (s.querySelector('div').textContent === slot) s.classList.add('selected-slot'); });
    updateBtn();
  }

  function updateBtn() {
    document.getElementById('confirm-btn').disabled = !selSlot;
  }

  function confirmBooking() {
    const name = document.getElementById('user-name').value.trim();
    const purpose = document.getElementById('purpose').value.trim();
    const date = document.getElementById('book-date').value;
    const dur = document.getElementById('duration').value;
    if (!name) { showAlert('Please enter your name.', 'error'); return; }
    if (!date) { showAlert('Please select a date.', 'error'); return; }
    if (!selSlot) { showAlert('Please select a time slot.', 'error'); return; }

    const eq = equipList.find(e => e.id === selEquip);
    const b = {
      id: Date.now().toString(),
      equipId: selEquip,
      equipName: eq.name,
      name, purpose: purpose || '—', date, slot: selSlot, duration: dur,
      bookedAt: new Date().toISOString()
    };
    bookings.push(b);
    save();
    showAlert(`Confirmed! ${eq.name} booked for ${formatDate(date)} at ${selSlot}.`, 'success');
    document.getElementById('user-name').value = '';
    document.getElementById('purpose').value = '';
    selSlot = null;
    renderSlots();
    renderEquipGrid();
    renderRecords();
  }

  function showAlert(msg, type) {
    const box = document.getElementById('alert-box');
    box.className = 'alert alert-' + type;
    box.innerHTML = `<i class="ti ${type === 'success' ? 'ti-circle-check' : 'ti-alert-circle'}"></i> ${msg}`;
    box.style.display = 'flex';
    setTimeout(() => box.style.display = 'none', 4500);
  }

  function renderRecords() {
    const search = (document.getElementById('search-input')?.value || '').toLowerCase();
    const filterEq = document.getElementById('filter-equip')?.value || '';

    const sel = document.getElementById('filter-equip');
    if (sel) {
      const cur = sel.value;
      sel.innerHTML = '<option value="">All equipment</option>' +
        equipList.map(e => `<option value="${e.id}" ${e.id === cur ? 'selected' : ''}>${e.name}</option>`).join('');
      sel.value = cur;
    }

    const filtered = bookings.filter(b => {
      const ms = !search || [b.name, b.equipName, b.purpose].some(v => v.toLowerCase().includes(search));
      const me = !filterEq || b.equipId === filterEq;
      return ms && me;
    }).sort((a, b) => new Date(b.bookedAt) - new Date(a.bookedAt));

    const tbody = document.getElementById('records-tbody');
    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty"><i class="ti ti-calendar-off"></i><p>No bookings found</p></div></td></tr>`;
    } else {
      tbody.innerHTML = filtered.map(b => {
        const ei = equipList.findIndex(e => e.id === b.equipId);
        const p = palette(ei);
        const ba = new Date(b.bookedAt);
        const baStr = ba.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) + ', ' + ba.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
        return `<tr>
          <td><span class="badge" style="background:${p.bg};color:${p.text}">${b.equipName}</span></td>
          <td>${b.name}</td>
          <td>${formatDate(b.date)}</td>
          <td style="font-family:monospace">${b.slot}</td>
          <td>${b.duration}h</td>
          <td style="color:var(--text-secondary)">${b.purpose}</td>
          <td style="color:var(--text-tertiary);font-size:11px">${baStr}</td>
          <td><button class="del-btn" onclick="deleteBooking('${b.id}')" title="Delete booking"><i class="ti ti-trash"></i></button></td>
        </tr>`;
      }).join('');
    }

    const today = todayStr();
    const todayCount = bookings.filter(b => b.date === today).length;
    const totalHours = bookings.reduce((s, b) => s + parseInt(b.duration), 0);
    const uniqueUsers = new Set(bookings.map(b => b.name)).size;
    document.getElementById('stats-row').innerHTML = [
      { val: bookings.length, lbl: 'Total bookings' },
      { val: todayCount,      lbl: "Today's bookings" },
      { val: uniqueUsers,     lbl: 'Unique users' },
      { val: totalHours + 'h', lbl: 'Total hours booked' },
    ].map(s => `<div class="stat-card"><div class="stat-val">${s.val}</div><div class="stat-lbl">${s.lbl}</div></div>`).join('');
  }

  function deleteBooking(id) {
    if (!confirm('Delete this booking?')) return;
    bookings = bookings.filter(b => b.id !== id);
    save();
    renderRecords();
    renderEquipGrid();
    if (selEquip) renderSlots();
  }

  function exportCSV() {
    if (!bookings.length) { alert('No bookings to export.'); return; }
    const header = ['Equipment', 'Booked By', 'Date', 'Slot', 'Duration (hrs)', 'Purpose', 'Booked At'];
    const rows = bookings.map(b => [
      b.equipName, b.name, b.date, b.slot, b.duration, b.purpose,
      new Date(b.bookedAt).toLocaleString('en-IN')
    ]);
    const csv = [header, ...rows].map(r => r.map(v => `"${v}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = 'lab-bookings-' + todayStr() + '.csv';
    a.click();
  }

  function renderManage() {
    const list = document.getElementById('manage-list');
    if (!equipList.length) { list.innerHTML = '<div class="empty"><p>No equipment added yet.</p></div>'; return; }
    list.innerHTML = equipList.map((e, i) => {
      const p = palette(i);
      const bCount = bookings.filter(b => b.equipId === e.id).length;
      return `<div class="manage-equip-row">
        <i class="ti ${e.icon}" style="color:${p.text}"></i>
        <div style="flex:1">
          <div style="font-size:14px;font-weight:500">${e.name}</div>
          <div style="font-size:12px;color:var(--text-secondary)">${e.desc} &nbsp;·&nbsp; ${bCount} booking${bCount !== 1 ? 's' : ''}</div>
        </div>
        <button class="del-btn" onclick="removeEquip('${e.id}')" title="Remove"><i class="ti ti-trash"></i></button>
      </div>`;
    }).join('');
  }

  function addEquipment() {
    const name = document.getElementById('new-name').value.trim();
    const desc = document.getElementById('new-desc').value.trim();
    const icon = document.getElementById('new-icon').value;
    if (!name) { alert('Please enter a name.'); return; }
    const id = name.toLowerCase().replace(/\s+/g, '-') + '-' + Date.now();
    equipList.push({ id, name, desc: desc || name, icon });
    save();
    document.getElementById('new-name').value = '';
    document.getElementById('new-desc').value = '';
    renderEquipGrid();
    renderManage();
    renderRecords();
  }

  function removeEquip(id) {
    const eq = equipList.find(e => e.id === id);
    const bCount = bookings.filter(b => b.equipId === id).length;
    const msg = bCount > 0
      ? `Remove "${eq.name}"? This will also delete ${bCount} booking(s).`
      : `Remove "${eq.name}"?`;
    if (!confirm(msg)) return;
    equipList = equipList.filter(e => e.id !== id);
    bookings = bookings.filter(b => b.equipId !== id);
    save();
    if (selEquip === id) { selEquip = null; document.getElementById('booking-form').style.display = 'none'; }
    renderEquipGrid();
    renderManage();
    renderRecords();
  }

  function switchTab(tab) {
    document.querySelectorAll('.nav-item').forEach((n, i) => {
      n.classList.toggle('active', ['book', 'records', 'manage'][i] === tab);
    });
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    if (tab === 'records') renderRecords();
  }

  load();
</script>
</body>
</html>
